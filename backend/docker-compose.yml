version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gamelogger-postgres
    environment:
      POSTGRES_USER: gamelogger
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: gamelogger
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamelogger"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
