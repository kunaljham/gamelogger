version: '3.8'

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: gamelogger-postgres-test
    environment:
      POSTGRES_USER: gamelogger_test
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: gamelogger_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamelogger_test"]
      interval: 2s
      timeout: 5s
      retries: 5
